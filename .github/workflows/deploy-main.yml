name: Deploy Aspire App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}

    steps:
      - name: Validate required secrets and add to environment
        shell: bash
        run: |
          set -euo pipefail

          required=(
            KOMODO_URL
            KOMODO_API_KEY
            KOMODO_API_SECRET
            POSTGRES_USER
            POSTGRES_PASSWORD
            TELEGRAM_BOT_TOKEN
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
            TMDB_API_KEY
            ASPIRE_BROWSER_TOKEN
          )

          for name in "${required[@]}"; do
            value=$(echo "$SECRETS_JSON" | jq -r --arg k "$name" '.[$k] // empty')
            if [ -z "$value" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
            echo "${name}=${value}" >> $GITHUB_ENV
          done

      - name: Check out repository
        uses: actions/checkout@v4

      # Export all non-Portainer secrets as both plain env vars and
      # Parameters__ aliases for Aspire's .NET configuration binding.
      - name: Export secrets for Aspire
        shell: bash
        run: |
          echo "$SECRETS_JSON" | jq -r '
            to_entries[]
            | select(.key | test("^PORTAINER_|^KOMODO_|^GITHUB_") | not)
            | "\(.key)=\(.value)",
              "Parameters__\(.key | ascii_downcase | gsub("_";"-"))=\(.value)"
          ' >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Aspire CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Show Aspire CLI version
        shell: bash
        run: aspire --version

      # GHCR requires auth even to push to your own namespace. The automatic
      # GITHUB_TOKEN can write packages under this repo's owner and nowhere else,
      # which is exactly the scope wanted here — no stored secret to rotate.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images and prepare env with Aspire
        shell: bash
        run: aspire do push-and-prepare-env --environment production --non-interactive

      # Deploying is two calls to Komodo, one step each, through the shared
      # composite actions in the homelab repo: one tested Python client instead
      # of hand-rolled curl in two repos. Creating the stack when it is missing
      # is folded into update-stack. The API key belongs to the
      # `trakt-tg-bot-ci` service user: Write on this one stack, plus Read +
      # Attach on the server so create-if-missing can place it there.
      # KOMODO_URL / KOMODO_API_KEY / KOMODO_API_SECRET reach these steps
      # through GITHUB_ENV, exported by the first step of the job.
      - name: Read the dashboard's published port
        id: dash
        shell: bash
        run: |
          set -euo pipefail
          # The host port is read back from Aspire's own output, so it is
          # declared once, in apphost.cs.
          port=$(yq '.services[] | select(.container_name == "aspire") | .ports[0]' \
                   aspire-output/docker-compose.yaml | cut -d: -f1)
          [ -n "$port" ] || { echo "no published dashboard port in the compose output" >&2; exit 1; }
          echo "port=$port" >> "$GITHUB_OUTPUT"

          # The token logs the browser in on click, and it lands in a query
          # string, so percent-encode it: a bare + would arrive as a space.
          # The encoded form is a different string from the registered secret,
          # so mask it explicitly or GitHub would not redact it from a log.
          token=$(jq -rn --arg t "$ASPIRE_BROWSER_TOKEN" '$t|@uri')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Push the generated compose and env to the stack
        uses: lorainemg/homelab/.github/actions/komodo/update-stack@main
        with:
          komodo-url: ${{ env.KOMODO_URL }}
          api-key: ${{ env.KOMODO_API_KEY }}
          api-secret: ${{ env.KOMODO_API_SECRET }}
          stack: trakt-tg-bot
          create-if-missing: true
          compose-file: aspire-output/docker-compose.yaml
          env-file: aspire-output/.env.production
          # Komodo logs in to GHCR before compose up, with the read-only account
          # stored in its config (homelab: komodo/registries.config.toml).
          registry-provider: ghcr.io
          registry-account: lorainemg
          links: http://${HOMELAB_LAN_IP}:${{ steps.dash.outputs.port }}/login?t=${{ steps.dash.outputs.token }}
          vars: HOMELAB_LAN_IP=172.20.3.194

      - name: Deploy the stack and wait for the result
        uses: lorainemg/homelab/.github/actions/komodo/deploy-stack@main
        with:
          komodo-url: ${{ env.KOMODO_URL }}
          api-key: ${{ env.KOMODO_API_KEY }}
          api-secret: ${{ env.KOMODO_API_SECRET }}
          stack: trakt-tg-bot
