name: Deploy Aspire App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}

    steps:
      - name: Validate required secrets and add to environment
        shell: bash
        run: |
          set -euo pipefail

          required=(
            KOMODO_URL
            KOMODO_API_KEY
            KOMODO_API_SECRET
            POSTGRES_USER
            POSTGRES_PASSWORD
            TELEGRAM_BOT_TOKEN
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
            TMDB_API_KEY
            ASPIRE_BROWSER_TOKEN
          )

          for name in "${required[@]}"; do
            value=$(echo "$SECRETS_JSON" | jq -r --arg k "$name" '.[$k] // empty')
            if [ -z "$value" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
            echo "${name}=${value}" >> $GITHUB_ENV
          done

      - name: Check out repository
        uses: actions/checkout@v4

      # Export all non-Portainer secrets as both plain env vars and
      # Parameters__ aliases for Aspire's .NET configuration binding.
      - name: Export secrets for Aspire
        shell: bash
        run: |
          echo "$SECRETS_JSON" | jq -r '
            to_entries[]
            | select(.key | test("^PORTAINER_|^KOMODO_|^GITHUB_") | not)
            | "\(.key)=\(.value)",
              "Parameters__\(.key | ascii_downcase | gsub("_";"-"))=\(.value)"
          ' >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Aspire CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Show Aspire CLI version
        shell: bash
        run: aspire --version

      - name: Push images and prepare env with Aspire
        shell: bash
        run: aspire do push-and-prepare-env --environment production --non-interactive

      # Deploying is three calls to Komodo, one step each. Plain curl on
      # purpose: the official npm client assumes browser storage at import time
      # and needed a version pin plus two node flags to run at all (see PRs
      # #6-#8). The API key belongs to the `trakt-tg-bot-ci` service user: Write
      # on this one stack, plus Read + Attach on the server so it can create the
      # stack when missing. KOMODO_URL / KOMODO_API_KEY / KOMODO_API_SECRET reach
      # these steps through GITHUB_ENV, exported by the first step of the job.
      - name: Ensure the Komodo stack exists
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" -H 'Content-Type: application/json')

          # First run against a server that has never seen this stack (or a
          # rebuilt one): create the Stack shell if it is missing. Komodo lets
          # non-admins create stacks unless KOMODO_DISABLE_NON_ADMIN_CREATE is
          # set, needs Read + Attach on the server to place it there, and grants
          # the creator Write on it. A missing stack answers HTTP 500 "Did not
          # find any Stack", not a 404, so branch on the body, not the status.
          lookup=$(curl -s -X POST "$KOMODO_URL/read" "${auth[@]}" \
            -d '{"type":"GetStack","params":{"stack":"trakt-tg-bot"}}')
          if jq -e '.error | test("Did not find any Stack")' <<<"$lookup" > /dev/null 2>&1; then
            echo "Stack trakt-tg-bot does not exist yet; creating it"
            curl -sf -X POST "$KOMODO_URL/write" "${auth[@]}" -d '{
              "type": "CreateStack",
              "params": { "name": "trakt-tg-bot", "config": {
                "server_id": "Local", "project_name": "trakt-tg-bot",
                "file_contents": "services: {}", "webhook_enabled": false } }
            }' > /dev/null
          elif ! jq -e '.name == "trakt-tg-bot"' <<<"$lookup" > /dev/null 2>&1; then
            echo "GetStack failed:"; echo "$lookup"; exit 1
          fi

      - name: Push the generated compose and env to the stack
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" -H 'Content-Type: application/json')

          # jq, not string interpolation: the YAML is full of quotes/newlines.
          jq -n --rawfile yaml aspire-output/docker-compose.yaml \
                --rawfile env aspire-output/.env.production '{
            type: "UpdateStack",
            params: { id: "trakt-tg-bot",
                      config: { file_contents: $yaml, environment: $env,
                                links: ["http://172.20.3.194:28888"] } }
          }' > payload.json
          curl -sf -X POST "$KOMODO_URL/write" "${auth[@]}" --data @payload.json > /dev/null

      - name: Deploy the stack and wait for the result
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" -H 'Content-Type: application/json')

          # /execute is async: a 2xx means accepted, not deployed. Poll the
          # Update until it completes and fail the job if the deploy failed.
          update_id=$(curl -sf -X POST "$KOMODO_URL/execute" "${auth[@]}" \
            -d '{"type":"DeployStack","params":{"stack":"trakt-tg-bot"}}' \
            | jq -r '._id."$oid"')
          for i in $(seq 1 60); do
            sleep 5
            status=$(curl -sf -X POST "$KOMODO_URL/read" "${auth[@]}" \
              -d "{\"type\":\"GetUpdate\",\"params\":{\"id\":\"$update_id\"}}")
            [ "$(jq -r .status <<<"$status")" = "Complete" ] && break
          done
          jq -e '.status == "Complete" and .success == true' <<<"$status" > /dev/null \
            || { echo "Komodo deploy failed:"; jq . <<<"$status"; exit 1; }
